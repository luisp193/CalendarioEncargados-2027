name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      # La llave de firma no esta en el repo: se reconstruye aqui desde el secret.
      - name: Preparar la llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret KEYSTORE_BASE64. Sin el, el APK no se firma con la llave fija y no se puede instalar encima del instalado."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/calendario.keystore
          echo "Llave preparada ($(stat -c%s app/calendario.keystore) bytes)."
      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --stacktrace
      - name: Comprobar que va firmado con la llave fija
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep -A1 "Owner:" | head -2
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep "SHA256:" | head -1
      - name: Nombre con número de cambio
        id: ver
        run: |
          V="Calendario_V$(tr -d '[:space:]' < version.txt)"
          cp app/build/outputs/apk/debug/app-debug.apk "$V.apk"
          cp app/build/outputs/apk/debug/app-debug.apk Calendario.apk
          echo "name=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: ${{ steps.ver.outputs.name }}.apk
      # Release con enlace directo: Calendario.apk (enlace fijo) y Calendario_V<n>.apk (versión concreta).
      - name: Publicar APK descargable
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.ver.outputs.name }}
        run: |
          gh release view ultimo-apk >/dev/null 2>&1 ||             gh release create ultimo-apk --title "Calendario - última compilación" --notes "Última versión compilada desde main."
          # Quitar APKs de versiones anteriores para no acumular
          for a in $(gh release view ultimo-apk --json assets -q '.assets[].name' | grep -E '^Calendario_V[0-9]+\.apk$' | grep -v "^$NAME.apk$" || true); do
            gh release delete-asset ultimo-apk "$a" -y
          done
          gh release upload ultimo-apk Calendario.apk "$NAME.apk" --clobber
          gh release edit ultimo-apk --title "Calendario - $NAME" --notes "$NAME generado desde main el $(date -u '+%d/%m/%Y %H:%M UTC'). Commit ${GITHUB_SHA::7}."
      - name: Borrar la llave del runner
        if: always()
        run: rm -f app/calendario.keystore
